<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Ejido</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .admin-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type="text"], input[type="password"], input[type="date"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { resize: vertical; height: 100px; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #219653; }
        .hidden { display: none; }
        .login-box { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-danger { background-color: #e74c3c; margin-top: 15px; }
        .btn-danger:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO (TOKEN) -->
    <div id="loginSection" class="login-box">
        <h2>🔑 Acceso Administrador</h2>
        <div class="form-group">
            <label for="githubToken">Token de GitHub (Personal Access Token):</label>
            <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
        </div>
        <button onclick="verificarToken()">Entrar al Panel</button>
    </div>

    <!-- PANEL DE CREACIÓN Y GESTIÓN DE AVISOS -->
    <div id="adminSection" class="admin-container hidden">
        <h2>📢 Publicar Nuevo Aviso</h2>
        <form id="avisoForm" onsubmit="publicarAviso(event)">
            <div class="form-group">
                <label for="titulo">Título del aviso:</label>
                <input type="text" id="titulo" required placeholder="Ej. Próxima Asamblea General">
            </div>

            <div class="form-group">
                <label for="fecha">Fecha del aviso o evento:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="resumen">Resumen breve:</label>
                <textarea id="resumen" required placeholder="Escribe de qué trata el aviso..."></textarea>
            </div>

            <div class="form-group">
                <label for="enlaceFacebook">Enlace completo de Facebook (Opcional):</label>
                <input type="text" id="enlaceFacebook" placeholder="https://www.facebook.com/share/p/...">
            </div>

            <button type="submit" id="btnPublicar">Publicar en la Página</button>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">
        
        <h3>📋 Avisos Publicados Recientemente</h3>
        <!-- Contenedor donde admin.js dibujará la lista de avisos con su botón de eliminar -->
        <div id="listaAvisosAdmin"></div>

        <button type="button" class="btn-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <script src="admin.js?v=4"></script>
</body>
</html>
